# SwagIQ Configuration File
# Edit this file to customize the analytics pipeline behavior

video:
  # Video source type: local_file, youtube, twitch, http_stream
  source_type: local_file
  
  # Path to local video file
  local_path: "data/videos/clip1.mp4"
  
  # YouTube video URL (if source_type is youtube)
  youtube_url: ""
  
  # Twitch stream URL (if source_type is twitch)
  twitch_url: ""
  
  # Frame sampling rate (process every N frames)
  frame_sample_rate: 1
  
  # Maximum frames to process (0 = all)
  max_frames: 0
  
  # Video resize factor (0.5 = half size, faster processing)
  resize_factor: 1.0

roboflow:
  # Roboflow API configuration
  api_key: "YOUR_ROBOFLOW_API_KEY"
  
  # Project names for different detection tasks
  projects:
    players: "basketball-players"
    ball: "basketball-ball"
    basket: "basketball-basket"
  
  # Model versions
  versions:
    players: 1
    ball: 1
    basket: 1
  
  # Detection confidence threshold
  confidence_threshold: 0.5
  
  # Overlap threshold for NMS
  overlap_threshold: 0.3

tracking:
  # SAM 3 Model configuration
  sam_model: "sam2_hiera_small"  # small, large, mobile_tiny
  
  # Tracking confidence threshold
  min_track_confidence: 0.3
  
  # Maximum distance for track association (pixels)
  max_track_distance: 100
  
  # Track TTL (time to live in frames)
  track_ttl: 30

jersey_ocr:
  # OCR Configuration
  use_paddle_ocr: true  # Use PaddleOCR instead of Tesseract
  
  # Minimum confidence for jersey recognition
  min_confidence: 0.6
  
  # Use custom fine-tuned model
  use_custom_model: false
  custom_model_path: "models/jersey_ocr_custom.pt"

shot_detection:
  # Shot detection parameters
  buffer_size: 15  # Frames to analyze for shooting motion
  
  # Hand pose confidence threshold
  hand_pose_min_confidence: 0.5
  
  # Shooting motion thresholds
  min_upward_motion_ratio: 0.4
  min_arm_extension: 20  # pixels
  min_velocity: 10  # pixels/frame
  
  # Ball trajectory parameters
  min_trajectory_points: 3
  gravity: 32.174  # ft/s^2
  basket_diameter: 1.5  # feet

statistics:
  # NBA Court dimensions
  court_length: 94  # feet
  court_width: 50  # feet
  three_point_distance: 23.75  # feet
  basket_height: 10  # feet
  
  # Shot type classification
  shot_types:
    layup_max_distance: 3  # feet
    two_point_max_distance: 23.75  # feet

output:
  # Output directory
  output_dir: "output"
  
  # Report generation
  reports:
    generate_pdf: true
    generate_json: true
    generate_csv: true
  
  # Video annotations
  annotate_video: true
  annotation_output: "output/annotated_video.mp4"
  
  # Statistics export
  statistics_format: "json"  # json, csv, both

game:
  # Game information (can be overridden at runtime)
  home_team: "Home"
  away_team: "Away"
  date: ""
  location: ""
  
  # Quarters configuration
  quarters: 4
  quarter_duration: 600  # seconds

performance:
  # GPU acceleration
  use_gpu: true
  gpu_device: 0  # 0 for first GPU
  
  # Batch processing
  batch_size: 1
  
  # Threading
  num_threads: 4
  
  # Logging level: DEBUG, INFO, WARNING, ERROR
  log_level: "INFO"

debug:
  # Debug mode
  enabled: false
  
  # Save intermediate frames
  save_debug_frames: false
  debug_output_dir: "debug_output"
  
  # Verbose logging
  verbose: false
  
  # Visualize detections
  visualize_detections: true
